syntax = "proto3";
package proto;
option go_package = "./proto";

message HunterTalents {
	int32 deadly_aspects = 1;
	int32 endurance_training = 2;
	int32 focused_fire = 3;
	int32 improved_aspect_of_the_monkey = 4;
	int32 pathfinding = 5;
	int32 improved_revive_pet = 6;
	bool bestial_swiftness = 7;
	int32 unleashed_fury = 8;
	int32 improved_mend_pet = 9;
	int32 ferocity = 10;
	bool summon_hawk = 11;
	int32 spirit_bond = 12;
	bool intimidation = 13;
	int32 bestial_discipline = 14;
	int32 frenzy = 15;
	bool bestial_wrath = 16;

	int32 hawk_eye = 17;
	int32 improved_concussive_shot = 18;
	int32 lethal_attacks = 19;
	int32 improved_stings = 20;
	int32 efficiency = 21;
	int32 careful_aim = 22;
	int32 rapid_killing = 23;
	int32 improved_arcane_shot = 24;
	bool lone_wolf = 25;
	bool trueshot_aura = 26;
	int32 mortal_shots = 27;
	int32 rapid_recuperation = 28;
	int32 barrage = 29;
	bool scatter_shot = 30;
	int32 ranged_weapon_specialization = 31;
	bool sniper_shot = 32;

	int32 improved_tracking = 33;
	int32 deflection = 34;
	int32 entrapment = 35;
	int32 savage_strikes = 36;
	int32 survivalist = 37;
	int32 improved_wing_clip = 38;
	int32 clever_traps = 39;
	int32 surefooted = 40;
	bool deterrence = 41;
	int32 survival_tactics = 42;
	int32 predators_edge = 43;
	bool counterattack = 44;
	int32 resourcefulness = 45;
	int32 expose_prey = 46;
	int32 survivalist_discipline = 47;
	bool strider_kick = 48;
	int32 lightning_reflexes = 49;
	bool lacerating_strikes = 50;
}

message Hunter {
	message Rotation {
		enum RotationType {
			UnknownType = 0;
			SingleTarget = 1;
			Aoe = 3;
			Custom = 2;
		}
		RotationType type = 9;
		enum StingType {
			NoSting = 0;
			ScorpidSting = 1;
			SerpentSting = 2;
		}
		StingType sting = 2;
		bool multi_dot_serpent_sting = 3;
	}

	message Options {
		enum Ammo {
			AmmoNone = 0;
			RazorArrow = 1;
			SolidShot = 2;
			JaggedArrow = 3;
			AccurateSlugs = 4;
			MithrilGyroShot = 5;
			RockshardPellets = 6;
			IceThreadedArrow = 7;
			ThoriumHeadedArrow = 8;
			Doomshot = 9;
			IceThreadedBullet = 10;
			ThoriumShells = 11;
			MiniatureCannonBalls = 12;
			SwiftfeatherArrow = 13;
			SwiftstrikeShot = 14;
		}
		Ammo ammo = 1;
		enum QuiverBonus {
			QuiverNone = 0;
			Speed10 = 1;
			Speed11 = 2;
			Speed12 = 3;
			Speed13 = 4;
			Speed14 = 5;
			Speed15 = 6;
		}
		QuiverBonus quiver_bonus = 2;
		enum PetType {
			PetNone = 0;
			Cat = 1;
			WindSerpent = 2;
			Wolf = 3;
			Bat = 4;
			Bear = 5;
			Owl = 6;
			Boar = 7;
			CarrionBird = 8;
			Crab = 9;
			Crocolisk = 10;
			Gorilla = 11;
			Hyena = 12;
			Raptor = 13;
			Scorpid = 14;
			Spider = 15;
			Tallstrider = 16;
			Turtle = 17;
			Fox = 18;
			CoreHound = 19;
			BirdOfPrey = 20;
		}
		enum PetAttackSpeed {
			One = 0;
			OneTwo = 1;
			OneThree = 2;
			OneFour = 3;
			OneFive = 4;
			OneSix = 5;
			OneSeven = 6;
			Two = 7;
			TwoFour = 8;
			TwoFive = 9;
		}
		PetType pet_type = 3;
		double pet_uptime = 4;
		double pet_attack_speed_old = 5;
		bool new_raptor_strike = 6;
		PetAttackSpeed pet_attack_speed = 7;
		bool lacerating_rollover = 8;
		// Forever beta bug: every pet hits as hard as a 2.0-speed pet, so fast pets deal extra damage.
		bool pet_speed_bug = 9;
		// How a new Mongoose Bite bleed meets the one already ticking (Lacerating Strikes).
		enum LaceratingMode {
			LaceratingRefresh = 0;
			LaceratingStrongest = 1;
			LaceratingRolling = 2;
		}
		LaceratingMode lacerating_mode = 10;
		// Forever's Windfury and Flametongue Totems are party auras, so a pet in range can get them.
		bool pet_windfury_totem = 11;
		bool pet_flametongue_totem = 12;
		// Extra time before every step into or out of melee (turning, reaction), on top of the walk itself.
		int32 move_delay_ms = 13;
		// Abilities the pet does not use; every ability of its family is on by default.
		enum PetAbility {
			PetAbilityUnknown = 0;
			PetAbilityBite = 1;
			PetAbilityClaw = 2;
			PetAbilityLightningBreath = 3;
			PetAbilityScorpidPoison = 4;
			PetAbilitySavageRend = 5;
			PetAbilityFuriousHowl = 6;
			PetAbilityThunderstomp = 7;
			PetAbilityDismember = 8;
			PetAbilityPinch = 9;
			PetAbilityTendonRip = 10;
			PetAbilityWeb = 11;
			PetAbilitySwipe = 12;
			PetAbilityMine = 13;
			PetAbilityCharge = 14;
			PetAbilityDemoralizingScreech = 15;
			PetAbilityLavaBreath = 16;
			PetAbilityDustCloud = 17;
			PetAbilityTrickstersDance = 18;
			PetAbilitySonicBlast = 19;
		}
		repeated PetAbility pet_disabled_abilities = 14;
		// Cats only: Faster Attack rank 0-7 (+17/25/33/43/54/67/100% attack speed).
		reserved 15; // pet_faster_attack_rank: the attack speed already includes Faster Attack
		// Explosive Trap's burn also gets the attack power share of its first hit (off: the first hit only).
		bool explosive_trap_burn_ap = 16;
		// Forever bug: pressing Auto Shot over and over shortens every Auto Shot after the first.
		bool auto_shot_spam_bug = 17;
		// Run speed in yards per second before speed effects; 0 is the game's 7.
		double run_speed = 18;
		// Skyborne: Skysight / Read Leyline cast at an elemental convergence or leyline lasts 15 minutes, so it is up the
		// whole fight; off, it is only cast if the rotation asks for it (30 s on a 2 min cooldown).
		bool skyborne_convergence = 19;
		reserved 20; // trap_reach: traps now always reach 6 yd (tested in game)
		// Mortal Shots' crit bonus skips Auto Shot (an earlier report; the game applies it); off, Auto Shot gets it.
		bool mortal_shots_skips_auto_shot = 21;
		// Melee swings restart the Auto Shot timer: a live beta bug Blizzard confirmed (forever-bugs #14), off by default
		// as it is expected to be fixed.
		bool melee_resets_auto_shot = 22;
	}

	Options options = 2;
}